<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Neolithic: Carrying Capacity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .cinzel { font-family: 'Cinzel', serif; }

    /* ── Sky: ecology-driven, no seasons ── */
    .sky-pristine { background: linear-gradient(to bottom, #2E6FA3 0%, #5BAED4 35%, #9ED4C0 70%, #B8E8A8 100%); }
    .sky-hazy     { background: linear-gradient(to bottom, #7A4F1A 0%, #C47D35 35%, #E8B86D 68%, #C9A06A 100%); }
    .sky-bleak    { background: linear-gradient(to bottom, #1A1A1E 0%, #3A3A42 45%, #6B6B72 100%); }

    /* ── Ground overlay ── */
    .ground-lush   { background: linear-gradient(to top, #14532D 0%, #166534 35%, #15803D 65%, transparent 100%); }
    .ground-sparse { background: linear-gradient(to top, #78350F 0%, #92400E 30%, #A16207 58%, transparent 100%); }
    .ground-dead   { background: linear-gradient(to top, #1C1917 0%, #44403C 30%, #78716C 58%, transparent 100%); }

    .landscape-container {
      position: relative; overflow: hidden;
      transition: background 2.5s ease;
    }
    .landscape-ground {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 46%; pointer-events: none;
      transition: background 2.5s ease; z-index: 4;
    }

    /* ── Entities ── */
    .entity        { position: absolute; transition: all .5s ease-out; }
    .animate-bob   { animation: bob 2.2s infinite ease-in-out; }
    .animate-grow  { animation: grow .4s cubic-bezier(.175,.885,.32,1.275) forwards; }
    .animate-sway  { animation: sway 3.8s infinite ease-in-out; }
    .shake-screen  { animation: shake .45s ease-in-out; }

    .floater {
      position: absolute;
      animation: float-up 2.2s forwards;
      pointer-events: none; font-weight: 700;
      z-index: 55; padding: 2px 10px;
      border-radius: 20px; font-size: 13px;
      white-space: nowrap; backdrop-filter: blur(4px);
      letter-spacing: .03em;
    }

    @keyframes bob      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes sway     { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
    @keyframes float-up { 0%{opacity:1;transform:translateY(0) translateX(-50%)} 100%{opacity:0;transform:translateY(-52px) translateX(-50%)} }
    @keyframes grow     { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes shake    { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

    @keyframes hop {
      0%  { transform:translate(0,0); opacity:0 }
      10% { opacity:1 }
      40% { transform:translate(20px,-13px) }
      70% { transform:translate(38px,0) }
      100%{ transform:translate(62px,-6px); opacity:0 }
    }
    .animate-hop { animation: hop 2.4s ease-in-out infinite; }

    @keyframes lumber {
      0%  { transform:translate(0,0); opacity:0 }
      12% { opacity:1 }
      55% { transform:translate(28px,-3px) }
      100%{ transform:translate(64px,0); opacity:0 }
    }
    .animate-lumber { animation: lumber 3.1s ease-in-out infinite; }

    @keyframes cloud-drift { 0%{transform:translateX(0)} 100%{transform:translateX(60px)} }

    @keyframes flash-red  { 0%,100%{opacity:0} 30%{opacity:1} }
    @keyframes flash-blue { 0%,100%{opacity:0} 30%{opacity:1} }
    .flash-danger { animation: flash-red  .55s ease-in-out; background: rgba(220,38,38,.22); }
    .flash-move   { animation: flash-blue .55s ease-in-out; background: rgba(37,99,235,.18); }

    /* ── Squalor haze ── */
    .squalor-overlay {
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 38% 32%, rgba(0,0,0,0) 30%, rgba(20,17,14,.92) 100%),
        radial-gradient(circle at 72% 64%, rgba(0,0,0,0) 40%, rgba(15,20,30,.6) 100%);
      pointer-events:none; opacity:0; transition:opacity 1.2s; z-index:20;
      mix-blend-mode:multiply;
    }
    .sick-tint {
      position:absolute; inset:0;
      background: radial-gradient(circle at 50% 58%, rgba(34,197,94,0) 30%, rgba(34,197,94,.3) 100%);
      pointer-events:none; opacity:0; transition:opacity 1.2s; z-index:21;
      mix-blend-mode:overlay;
    }

    /* ── Vignette ── */
    .landscape-vignette {
      position:absolute; inset:0; pointer-events:none; z-index:6;
      background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0,0,0,.45) 100%);
    }

    /* ── Settlement dust patch ── */
    .settlement-base {
      position:absolute; pointer-events:none; z-index:5;
      border-radius:50%;
      background: radial-gradient(ellipse, rgba(120,90,50,.22) 0%, transparent 70%);
      transition: all 1s ease;
    }

    /* ── Stat bars ── */
    .stat-bar-track { height:5px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden; }
    .stat-bar-fill  { height:100%; border-radius:3px; transition:width .6s ease, background-color .6s ease; }

    /* ── Stat cards ── */
    .stat-card {
      background: rgba(10,6,2,.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px;
      padding: 9px 13px;
      color: white;
    }

    /* ── Action buttons ── */
    .btn-action { transition: transform .12s, box-shadow .2s; cursor: pointer; }
    .btn-action:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
    .btn-action:active { transform: scale(.94); box-shadow: none; }

    /* ── Log scrollbar ── */
    #log::-webkit-scrollbar { width: 3px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: #44403c; border-radius: 2px; }
  </style>
</head>

<body class="bg-stone-950 flex flex-col items-center justify-start p-3 lg:p-5 min-h-screen">

<div id="game-container" class="w-full max-w-5xl rounded-2xl shadow-2xl flex flex-col relative overflow-hidden"
     style="background:#0c0804; border:1px solid #2d1f10;">

  <!-- ═══ GAME OVER ═══ -->
  <div id="game-over-screen" class="hidden absolute inset-0 z-[60] flex flex-col items-center justify-center p-6 text-center animate-grow"
       style="background:radial-gradient(ellipse at center,rgba(50,0,0,.98) 0%,rgba(5,2,0,.99) 100%);">
    <div class="text-8xl mb-4" style="filter:drop-shadow(0 0 28px rgba(239,68,68,.85));">💀</div>
    <h1 class="cinzel text-5xl md:text-6xl text-red-500 mb-3" style="letter-spacing:.14em;">EXTINCTION</h1>
    <p class="text-stone-400 mb-1">Nature could not sustain your numbers.</p>
    <p class="text-stone-500 mb-8 font-mono text-sm">
      Your tribe endured for
      <span id="final-year" class="text-amber-400 font-bold text-lg">0</span> years.
    </p>
    <button onclick="location.reload()"
      class="cinzel px-10 py-3 rounded-lg font-bold tracking-widest text-sm transition-all hover:scale-105 active:scale-95 shadow-xl"
      style="background:linear-gradient(135deg,#78350f,#92400e); color:#fde68a; border:1px solid #b45309;">
      TRY AGAIN
    </button>
  </div>

  <!-- ═══ HEADER ═══ -->
  <div class="flex justify-between items-center px-4 md:px-6 py-2.5 z-30 shrink-0"
       style="background:linear-gradient(to right,#150a02,#1f1208,#150a02); border-bottom:1px solid #2d1f10;">
    <h1 class="cinzel text-sm md:text-base lg:text-lg font-bold tracking-[.18em] text-amber-500 uppercase">
      Neolithic: Carrying Capacity
    </h1>
    <div class="flex items-center gap-4 text-sm shrink-0">
      <div class="text-stone-400 font-mono text-xs md:text-sm">
        Year <span id="ui-year" class="text-amber-400 font-bold">1</span>
      </div>
      <div class="text-stone-500 text-xs font-mono">
        🦣 ×<span id="ui-mammoths">8</span>
      </div>
    </div>
  </div>

  <!-- ═══ LANDSCAPE ═══ -->
  <div id="landscape" class="landscape-container sky-pristine w-full" style="height: clamp(260px, 48vh, 520px);">

    <!-- Clouds -->
    <div id="cloud-layer" class="absolute inset-0 z-[3] pointer-events-none"></div>

    <!-- Sun (static) -->
    <div class="absolute top-5 right-12 z-[4] pointer-events-none text-4xl md:text-5xl animate-bob"
         style="filter:drop-shadow(0 0 14px rgba(255,220,50,.85));">☀️</div>

    <!-- Ground layer -->
    <div id="landscape-ground" class="landscape-ground ground-lush"></div>

    <!-- Settlement dust base -->
    <div id="settlement-base" class="settlement-base" style="display:none;"></div>

    <!-- Squalor FX -->
    <div id="squalor-fx"  class="squalor-overlay"></div>
    <div id="sick-tint"   class="sick-tint"></div>

    <!-- Flash FX -->
    <div id="flash-fx" class="absolute inset-0 z-[22] pointer-events-none" style="opacity:0;"></div>

    <!-- Entities -->
    <div id="entities" class="absolute inset-0 z-[10] pointer-events-none"></div>

    <!-- Vignette -->
    <div class="landscape-vignette"></div>

    <!-- ── HUD top-left ── -->
    <div class="absolute top-3 left-3 z-40 flex flex-col gap-2 pointer-events-none">

      <div class="stat-card animate-grow" style="min-width:148px;">
        <div class="flex items-center gap-2 mb-1">
          <i class="fas fa-users text-blue-400" style="font-size:9px;"></i>
          <span class="text-[9px] text-stone-500 uppercase tracking-widest font-bold">Population</span>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="ui-pop" class="text-xl md:text-2xl font-bold text-white">10</span>
          <span class="text-xs text-stone-600">/ <span id="ui-housing" class="text-stone-400">15</span></span>
        </div>
        <div class="stat-bar-track mt-1.5">
          <div id="bar-pop" class="stat-bar-fill bg-blue-500" style="width:67%"></div>
        </div>
      </div>

      <div class="stat-card animate-grow" style="animation-delay:.07s; min-width:148px;">
        <div class="flex items-center gap-2 mb-1">
          <i class="fas fa-drumstick-bite text-amber-400" style="font-size:9px;"></i>
          <span class="text-[9px] text-stone-500 uppercase tracking-widest font-bold">Food Stores</span>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="ui-food" class="text-xl md:text-2xl font-bold text-white">55</span>
          <span class="text-xs text-stone-600">/ <span id="ui-storage" class="text-stone-400">140</span></span>
        </div>
        <div class="stat-bar-track mt-1.5">
          <div id="bar-food" class="stat-bar-fill bg-amber-500" style="width:39%"></div>
        </div>
        <div id="storage-warn" class="hidden text-[9px] text-amber-400 font-bold mt-1 animate-pulse tracking-widest">⚠ STORES FULL</div>
      </div>

    </div>

    <!-- ── HUD bottom-right ecology ── -->
    <div class="absolute bottom-3 right-3 z-40 flex flex-col gap-1.5 pointer-events-none" style="min-width:120px;">

      <div class="stat-card" style="padding:6px 10px;">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[9px] text-stone-500 uppercase tracking-widest">Land</span>
          <span id="ui-land" class="text-[10px] font-bold text-green-400">100</span>
        </div>
        <div class="stat-bar-track">
          <div id="bar-land" class="stat-bar-fill bg-green-500" style="width:100%"></div>
        </div>
      </div>

      <div class="stat-card" style="padding:6px 10px;">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[9px] text-stone-500 uppercase tracking-widest">Wildlife</span>
          <span id="ui-deer" class="text-[10px] font-bold text-emerald-400">100</span>
        </div>
        <div class="stat-bar-track">
          <div id="bar-deer" class="stat-bar-fill bg-emerald-500" style="width:100%"></div>
        </div>
      </div>

      <div class="stat-card" style="padding:6px 10px;">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[9px] text-stone-500 uppercase tracking-widest">Squalor</span>
          <span id="ui-squalor" class="text-[10px] font-bold text-stone-400">0</span>
        </div>
        <div class="stat-bar-track">
          <div id="bar-squalor" class="stat-bar-fill bg-stone-500" style="width:0%"></div>
        </div>
      </div>

    </div>

    <!-- Cannot Move warning -->
    <div id="fail-msg" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 animate-grow text-center"
         style="background:rgba(70,0,0,.96); border:1px solid #ef4444; border-radius:14px; padding:22px 30px; min-width:210px;">
      <div class="text-4xl mb-2">🔒</div>
      <div class="cinzel font-bold text-red-300 text-sm tracking-widest mb-3">CANNOT MOVE</div>
      <div class="text-xs text-stone-400">Need <span id="fail-cost" class="text-white font-bold">0</span> food</div>
      <div class="text-xs text-stone-400 mt-1">Have <span id="fail-have" class="text-red-400 font-bold">0</span> food</div>
    </div>

  </div><!-- end landscape -->

  <!-- ═══ BOTTOM PANEL ═══ -->
  <div class="flex flex-col md:flex-row z-30 shrink-0"
       style="border-top:1px solid #2d1f10; background:linear-gradient(to bottom,#110b04,#0c0804); min-height:180px;">

    <!-- Event Log -->
    <div id="log"
         class="w-full md:w-[38%] lg:w-[36%] md:border-r overflow-y-auto p-3"
         style="border-color:#2d1f10; height:188px; order:2;">
      <div class="cinzel text-[9px] text-stone-700 uppercase tracking-widest mb-2 pb-1"
           style="border-bottom:1px solid #2d1f10;">Tribal History</div>
    </div>

    <!-- Action Buttons -->
    <div class="w-full md:w-[62%] lg:w-[64%] p-3 md:p-4 grid grid-cols-2 gap-2.5 md:gap-3"
         style="order:1;">

      <button onclick="window.game.action('hunt')"
        class="btn-action group rounded-xl flex flex-col items-center justify-center py-4 md:py-5 gap-1"
        style="background:linear-gradient(145deg,#052e16,#064e20); border:1px solid #166534;">
        <div class="text-2xl md:text-3xl group-hover:scale-110 transition-transform duration-150">🏹</div>
        <div class="cinzel font-bold text-green-300 text-xs md:text-sm tracking-wider mt-0.5">HUNT</div>
        <div class="text-[9px] md:text-[10px] text-green-900">deplete deer · mammoths finite</div>
      </button>

      <button onclick="window.game.action('farm')"
        class="btn-action group rounded-xl flex flex-col items-center justify-center py-4 md:py-5 gap-1"
        style="background:linear-gradient(145deg,#1c1000,#2c1a00); border:1px solid #92400e;">
        <div class="text-2xl md:text-3xl group-hover:scale-110 transition-transform duration-150">🌾</div>
        <div class="cinzel font-bold text-amber-300 text-xs md:text-sm tracking-wider mt-0.5">FARM</div>
        <div class="text-[9px] md:text-[10px] text-amber-900">farms ≤ pop · causes squalor</div>
      </button>

      <button onclick="window.game.action('build')"
        class="btn-action group rounded-xl flex flex-col items-center justify-center py-4 md:py-5 gap-1"
        style="background:linear-gradient(145deg,#0f0b07,#1a1510); border:1px solid #44403c;">
        <div class="text-2xl md:text-3xl group-hover:scale-110 transition-transform duration-150">🛖</div>
        <div class="cinzel font-bold text-stone-300 text-xs md:text-sm tracking-wider mt-0.5">BUILD</div>
        <div class="text-[9px] md:text-[10px] text-stone-700">+housing +storage · deepens trap</div>
      </button>

      <button onclick="window.game.action('move')"
        class="btn-action group rounded-xl flex flex-col items-center justify-center py-4 md:py-5 gap-1"
        style="background:linear-gradient(145deg,#030711,#05112e); border:1px solid #1d4ed8;">
        <div class="text-2xl md:text-3xl group-hover:scale-110 transition-transform duration-150">🦶</div>
        <div class="cinzel font-bold text-blue-300 text-xs md:text-sm tracking-wider mt-0.5">MOVE</div>
        <div class="text-[9px] md:text-[10px] font-bold" id="move-cost-text" style="color:#60a5fa;">Cost: 20</div>
      </button>

    </div>
  </div>

</div><!-- end game-container -->

<script>
// =========================================================================
//  TUNING SECTION
// =========================================================================
const TUNING = {
    WORLD_MAMMOTHS: 8,
    INIT_POP: 10,
    INIT_FOOD: 55,
    INIT_STORAGE: 40,
    INIT_HOUSING: 15,
    POP_EAT_RATE: 2.15,
    CARRY_CAPACITY: 10,
    GROWTH_BASE_RATE: 1.07,
    GROWTH_FARM_BOOST: 0.0016,
    GROWTH_SQUALOR_PENALTY: 0.18,
    BOOM_PER_TURN: 0.006,
    BOOM_MAX: 0.65,
    BOOM_START_DELAY: 4,
    FARM_LABOR_BASE: 48,
    FARM_LABOR_SCALE: 16,
    FARM_YIELD_PER_FARM: 10,
    FARM_UPKEEP_PER_FARM: 0.25,
    FARM_SQUALOR_HIT: 0.10,
    FARM_LAND_HIT: 0.35,
    FARM_YIELD_GROWTH_PER_TURN: 0.015,
    DEER_BASE_REGEN: 2.2,
    DEER_YIELD_PER_HUNTER: 5.8,
    DEER_DEPLETION_PER_HUNTER: 1.75,
    MAMMOTH_YIELD: 120,
    MAMMOTH_RISK: 0.18,
    HUNT_SQUALOR_HIT: 0.75,
    BUILD_COST_PER_POP: 0.55,
    BUILD_HOUSING_GAIN: 5,
    BUILD_STORAGE_GAIN: 40,
    OVERCROWD_SQUALOR_MULT: 10,
    SQUALOR_CROWDING_START: 0.9,
    SQUALOR_GAIN_SPEED: 0.2,
    SQUALOR_FROM_FARMS: 0.25,
    SQUALOR_FROM_BUILD: 0.70,
    SQUALOR_DECAY_LIGHT: 0.25,
    DISEASE_START: 55,
    DISEASE_SPIKE: 80,
    DISEASE_CHANCE_BASE: 0.1,
    DISEASE_DEATH_BASE: 0.02,
    DISEASE_DEATH_MAX: 0.10,
    LAND_DECAY_FROM_FARMS: 0.65,
    LAND_DECAY_FROM_BUILD: 1.10,
    LAND_DECAY_FROM_POP: 0.03,
    LAND_POP_THRESHOLD: 25,
    LAND_RECOVERY: 0.8,
    MOVE_COST_BASE: 14,
    MOVE_COST_SETTLED: 0.95,
    MOVE_COST_FLOOR: 12
};

// =========================================================================
//  GAME LOGIC (mechanics unchanged)
// =========================================================================
class Game {
  static worldMammoths = (TUNING.WORLD_MAMMOTHS !== undefined) ? TUNING.WORLD_MAMMOTHS : 8;
  static worldExtinctLogged = false;

  constructor(){
    this.safe = (val, def) => (typeof val === 'number' && !isNaN(val)) ? val : def;

    this.state = {
      turn: 1, season: 0,
      pop: this.safe(TUNING.INIT_POP, 10),
      food: this.safe(TUNING.INIT_FOOD, 55),
      baseStorage: this.safe(TUNING.INIT_STORAGE, 40),
      housingCap: this.safe(TUNING.INIT_HOUSING, 15),
      farms: 0, farmProgress: 0, builds: 0,
      deer: 100, land: 100, squalor: 0, settled: 0, turnsSinceMove: 0
    };

    this.ui = {
      pop:           document.getElementById('ui-pop'),
      housing:       document.getElementById('ui-housing'),
      food:          document.getElementById('ui-food'),
      storage:       document.getElementById('ui-storage'),
      storageWarn:   document.getElementById('storage-warn'),
      year:          document.getElementById('ui-year'),
      log:           document.getElementById('log'),
      landscape:     document.getElementById('landscape'),
      entities:      document.getElementById('entities'),
      squalorFx:     document.getElementById('squalor-fx'),
      sickTint:      document.getElementById('sick-tint'),
      moveCostText:  document.getElementById('move-cost-text'),
      failMsg:       document.getElementById('fail-msg'),
      failCost:      document.getElementById('fail-cost'),
      failHave:      document.getElementById('fail-have'),
      container:     document.getElementById('game-container'),
      gameOverScreen:document.getElementById('game-over-screen'),
      finalYear:     document.getElementById('final-year'),
      barPop:        document.getElementById('bar-pop'),
      barFood:       document.getElementById('bar-food'),
      barLand:       document.getElementById('bar-land'),
      barDeer:       document.getElementById('bar-deer'),
      barSqualor:    document.getElementById('bar-squalor'),
      uiLand:        document.getElementById('ui-land'),
      uiDeer:        document.getElementById('ui-deer'),
      uiSqualor:     document.getElementById('ui-squalor'),
      uiMammoths:    document.getElementById('ui-mammoths'),
      lsGround:      document.getElementById('landscape-ground'),
      settlementBase:document.getElementById('settlement-base'),
      cloudLayer:    document.getElementById('cloud-layer'),
      flashFx:       document.getElementById('flash-fx'),
    };

    this.log(`Fresh land. Deer are plentiful. Mammoths in the world: ${Game.worldMammoths}.`, 'birth');
    this.log(`Births compound each turn when food is strong.`, 'info');
    this.renderClouds();
    this.render();
  }

  clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
  getTotalStorage(){ return this.state.baseStorage + (this.state.pop * this.safe(TUNING.CARRY_CAPACITY, 10)); }
  density(){ return this.state.pop / Math.max(1, this.state.housingCap); }

  moveCost(){
    const s = this.state;
    return Math.max(
      this.safe(TUNING.MOVE_COST_FLOOR, 12),
      this.safe(TUNING.MOVE_COST_BASE, 14) + Math.floor(s.settled * this.safe(TUNING.MOVE_COST_SETTLED, 0.95))
    );
  }

  settlementBoom(){
    const s = this.state;
    const t = Math.max(0, s.turnsSinceMove - this.safe(TUNING.BOOM_START_DELAY, 4));
    return 1 + Math.min(this.safe(TUNING.BOOM_MAX, 0.65), t * this.safe(TUNING.BOOM_PER_TURN, 0.006));
  }

  farmMultiplier(){
    const s = this.state;
    const sq   = this.clamp(s.squalor,0,100)/100;
    const land = this.clamp(s.land,0,100)/100;
    return Math.max(0.25,
      (1-(sq*this.safe(TUNING.FARM_SQUALOR_HIT,.20))) *
      (1-((1-land)*this.safe(TUNING.FARM_LAND_HIT,.35)))
    );
  }

  huntMultiplier(){
    const s = this.state;
    const sq   = this.clamp(s.squalor,0,100)/100;
    const land = this.clamp(s.land,0,100)/100;
    return Math.max(0.05,
      (1-(sq*this.safe(TUNING.HUNT_SQUALOR_HIT,.75))) *
      (1-((1-land)*this.safe(TUNING.HUNT_LAND_HIT,.85)))
    );
  }

  action(type){
    const s = this.state;
    if(s.pop <= 0) return;

    if(type === "hunt"){
      let take = 0;
      if(Game.worldMammoths > 0){
        const attempt = Math.floor((s.pop/10.0)*(0.9+Math.random()*0.6));
        take = this.clamp(attempt,0,2);
        take = Math.min(take, Game.worldMammoths);
        if(take===0 && s.deer<30 && Math.random()>0.6) take=1;
        take = Math.min(take, Game.worldMammoths);
      }
      const mammothFood = take * this.safe(TUNING.MAMMOTH_YIELD,120);
      const deerFood    = Math.floor(s.pop * this.safe(TUNING.DEER_YIELD_PER_HUNTER,5.8) * (s.deer/100) * (0.85+Math.random()*.35) * this.huntMultiplier());
      s.food += mammothFood + deerFood;
      s.deer  = Math.max(0, s.deer - (s.pop*this.safe(TUNING.DEER_DEPLETION_PER_HUNTER,1.75)) - (take*7));

      if(take > 0){
        Game.worldMammoths = Math.max(0, Game.worldMammoths - take);
        this.spawnFloater(`+${mammothFood} 🦣`, "amber");
        if(Math.random() < this.safe(TUNING.MAMMOTH_RISK,.18)){
          const dead = Math.max(1, Math.ceil(s.pop*0.06));
          s.pop = Math.max(0, s.pop - dead);
          this.log(`MAMMOTH HUNT! ${dead} died in the chase.`, 'death');
          this.spawnFloater(`-${dead} ⚔️`, "red");
          this.flashScreen('danger');
        }
        this.log(`Hunt! Took ${take} mammoth${take>1?"s":""}  (+${mammothFood}) plus ${deerFood} deer-meat.`, 'hunt');
        this.log(`Mammoths remaining worldwide: ${Game.worldMammoths}.`, 'info');
        if(Game.worldMammoths===0 && !Game.worldExtinctLogged){
          Game.worldExtinctLogged = true;
          this.log("The last mammoth falls. They will not return.", 'death');
          this.spawnFloater("🦣 EXTINCT", "red");
        }
      } else {
        this.log(`Hunt! Deer-meat: ${deerFood}.${Game.worldMammoths===0?" (No mammoths remain.)":""}`, deerFood>0?'hunt':'warn');
      }
      const cap = this.getTotalStorage();
      if(s.food > cap){ s.food=cap; this.spawnFloater("Max Load!","stone"); }
      this.endTurn(); return;
    }

    if(type === "farm"){
      if(s.farms >= s.pop){
        this.log(`Farm limit: Farms (${s.farms}) cannot exceed Population (${s.pop}).`, 'warn');
        this.shake(); return;
      }
      const req = this.safe(TUNING.FARM_LABOR_BASE,48) + (s.farms*this.safe(TUNING.FARM_LABOR_SCALE,16));
      s.farmProgress += Math.floor(s.pop);
      let made = Math.min(Math.floor(s.farmProgress/req), s.pop-s.farms);
      if(made > 0){
        s.farms += made; s.farmProgress = s.farmProgress % req;
        this.log(`Expanded farms: +${made}. (Total: ${s.farms})`, 'farm');
        this.spawnFloater(`+${made} 🌾`, "amber");
        s.settled = this.clamp(s.settled + made*2.2, 0, 100);
      } else {
        this.log(`Worked fields (${Math.floor((s.farmProgress/req)*100)}%).`, 'farm');
        s.settled = this.clamp(s.settled + 0.6, 0, 100);
      }
      s.land = Math.max(0, s.land - (0.35 + made*0.25));
      this.endTurn(); return;
    }

    if(type === "build"){
      const cost = Math.ceil(s.pop * this.safe(TUNING.BUILD_COST_PER_POP,.55));
      if(s.food < cost){
        this.log(`Need ${cost} food to build!`, 'warn');
        this.shake(); return;
      }
      s.food -= cost;
      s.housingCap  += this.safe(TUNING.BUILD_HOUSING_GAIN,5);
      s.baseStorage += this.safe(TUNING.BUILD_STORAGE_GAIN,40);
      s.builds += 1;
      s.settled = this.clamp(s.settled+6.0, 0, 100);
      s.land    = Math.max(0, s.land-1.0);
      this.log(`Built shelters (+${this.safe(TUNING.BUILD_HOUSING_GAIN,5)} cap, +${this.safe(TUNING.BUILD_STORAGE_GAIN,40)} storage).`, 'build');
      this.spawnFloater("+Shelter 🛖", "stone");
      this.endTurn(); return;
    }

    if(type === "move"){
      const cost = this.moveCost();
      if(s.food < cost){
        this.ui.failCost.innerText = cost;
        this.ui.failHave.innerText = Math.floor(s.food);
        this.ui.failMsg.classList.remove('hidden');
        setTimeout(()=>this.ui.failMsg.classList.add('hidden'), 2600);
        this.shake(); return;
      }
      s.food -= cost; s.deer=100; s.land=100;
      s.farms=0; s.farmProgress=0; s.builds=0; s.squalor=0;
      s.housingCap  = this.safe(TUNING.INIT_HOUSING,15);
      s.baseStorage = this.safe(TUNING.INIT_STORAGE,40);
      s.settled=0; s.turnsSinceMove=0;
      this.log(`Migrated (-${cost} food). Fresh land. Mammoths worldwide: ${Game.worldMammoths}.`, 'move');
      this.spawnFloater("New Land! 🌍", "blue");
      this.flashScreen('move');
      this.renderClouds();
      this.render(); return;
    }
  }

  endTurn(){
    const s = this.state;
    s.turnsSinceMove += 1;

    const eatRate = this.safe(TUNING.POP_EAT_RATE, 1.15);
    const eat     = Math.ceil(s.pop * eatRate);
    s.food -= eat;

    if(s.farms > 0){
      const upkeep = Math.ceil(s.farms * this.safe(TUNING.FARM_UPKEEP_PER_FARM,.25));
      s.food -= upkeep;
      if(upkeep>0 && Math.random()>.6) this.spawnFloater(`-${upkeep} seed`,"amber");
    }

    if(s.farms > 0){
      const innovBonus = 1 + (s.turnsSinceMove * this.safe(TUNING.FARM_YIELD_GROWTH_PER_TURN,0));
      const yieldAmt   = Math.floor(s.farms * this.safe(TUNING.FARM_YIELD_PER_FARM,10) * innovBonus * this.farmMultiplier());
      const cap = this.getTotalStorage();
      const add = Math.max(0, Math.min(cap-s.food, yieldAmt));
      s.food += add;
      if(add>0) this.spawnFloater(`+${add} crop`,"amber");
    }

    const popPressure = Math.max(0, s.pop - this.safe(TUNING.LAND_POP_THRESHOLD,25));
    const landLoss =
      (s.farms  * this.safe(TUNING.LAND_DECAY_FROM_FARMS,.65)) +
      (s.builds * this.safe(TUNING.LAND_DECAY_FROM_BUILD,1.10)) +
      (popPressure * this.safe(TUNING.LAND_DECAY_FROM_POP,.03));
    const light    = (s.farms<=2 && s.builds<=1 && s.pop<=20);
    s.land = this.clamp(s.land - landLoss + (light ? this.safe(TUNING.LAND_RECOVERY,.8) : 0), 0, 100);

    const regen = this.safe(TUNING.DEER_BASE_REGEN,2.2) * (s.land/100);
    s.deer = Math.min(Math.min(s.land,100), Math.max(0, s.deer+regen));

    const d = this.density();
    let sqDelta = 0;
    const crowdStart = this.safe(TUNING.SQUALOR_CROWDING_START,.9);
    if(d > crowdStart) sqDelta += (d-crowdStart)*this.safe(TUNING.OVERCROWD_SQUALOR_MULT,16);
    sqDelta += s.farms  * this.safe(TUNING.SQUALOR_FROM_FARMS,.45);
    sqDelta += s.builds * this.safe(TUNING.SQUALOR_FROM_BUILD,.70);
    if(light) sqDelta -= this.safe(TUNING.SQUALOR_DECAY_LIGHT,.25);
    if(sqDelta>0) sqDelta *= this.safe(TUNING.SQUALOR_GAIN_SPEED,1.0);
    s.squalor = this.clamp(s.squalor + sqDelta, 0, 100);

    const diseaseStart = this.safe(TUNING.DISEASE_START,55);
    if(s.squalor >= diseaseStart){
      const chance = this.safe(TUNING.DISEASE_CHANCE_BASE,.22) + ((s.squalor-diseaseStart)/(100-diseaseStart))*0.35;
      if(Math.random() < chance){
        const t        = this.clamp((s.squalor-diseaseStart)/(100-diseaseStart), 0, 1);
        const deathRate= this.safe(TUNING.DISEASE_DEATH_BASE,.02) + t*(this.safe(TUNING.DISEASE_DEATH_MAX,.10)-this.safe(TUNING.DISEASE_DEATH_BASE,.02));
        const dead     = Math.max(1, Math.floor(s.pop*deathRate));
        s.pop = Math.max(0, s.pop-dead);
        this.log(`DISEASE WAVE! ${dead} perished.`, 'death');
        this.spawnFloater(`-${dead} ☠️`, "red");
        this.flashScreen('danger');
        if(s.squalor >= this.safe(TUNING.DISEASE_SPIKE,80))
          this.log("The air is foul. Coughing never stops.", 'warn');
      }
    }

    if(s.food < 0){
      const starved = Math.ceil(Math.abs(s.food)/5);
      s.pop=Math.max(0,s.pop-starved); s.food=0;
      this.log(`${starved} starved.`, 'death');
      this.spawnFloater(`-${starved} starve`,"red");
      this.flashScreen('danger');
    }

    if(s.pop > s.housingCap){
      const dead = Math.max(1, Math.ceil((s.pop-s.housingCap)*(0.18+(s.squalor/400))));
      s.pop = Math.max(0, s.pop-dead);
      this.log(`EXPOSURE! ${dead} died without shelter.`, 'death');
      this.spawnFloater(`-${dead} cold`,"red");
      this.flashScreen('danger');
    }

    if(s.farms>0 || s.builds>0){
      let add = Math.min(4.0, (s.farms*0.22)+(s.builds*0.8));
      if(s.food < eat*0.85) add += 1.2;
      s.settled = this.clamp(s.settled+add, 0, 100);
      if(Math.random()>0.84) this.log("You are rooted. Leaving would be unthinkable.", 'info');
    } else {
      s.settled = this.clamp(s.settled-0.35, 0, 100);
    }

    const cap        = this.getTotalStorage();
    const foodStrong = s.food > eat*1.15 && s.food > cap*0.22;
    if(foodStrong){
      const farmBoost  = 1+(s.farms*this.safe(TUNING.GROWTH_FARM_BOOST,.0016));
      const sqPenalty  = 1-(this.clamp(s.squalor,0,100)/100)*this.safe(TUNING.GROWTH_SQUALOR_PENALTY,.18);
      const growthRate = this.safe(TUNING.GROWTH_BASE_RATE,1.07) * farmBoost * Math.max(0.55,sqPenalty) * this.settlementBoom();
      let births = Math.floor(s.pop*(growthRate-1));
      if(births<1) births=1;
      if(Math.random()<0.18) births+=1;
      s.pop += births;
      this.log(`Births! +${births} (settled ${s.turnsSinceMove} turns)`, 'birth');
      this.spawnFloater(`+${births} 👶`, "blue");
    }

    s.season = (s.season+1)%4;
    if(s.season===0) s.turn++;

    if(s.land<25 && Math.random()>.75) this.log("The land is exhausted. The wild vanishes.", 'warn');
    if(s.deer<15 && Math.random()>.75) this.log("The hunt is thin. Hoofprints fade.", 'warn');

    this.render();
    if(s.pop===0) this.triggerGameOver();
  }

  triggerGameOver(){
    this.ui.finalYear.innerText = this.state.turn;
    this.ui.gameOverScreen.classList.remove('hidden');
  }

  // ── Visual helpers ──────────────────────────────────────────────────

  renderClouds(){
    const layer = this.ui.cloudLayer;
    layer.innerHTML = "";
    const n = 3 + Math.floor(Math.random()*4);
    for(let i=0; i<n; i++){
      const el = document.createElement('div');
      const top  = 3  + Math.random()*26;
      const left = Math.random()*85;
      const sz   = 26 + Math.floor(Math.random()*32);
      const dur  = (16 + Math.random()*14).toFixed(1);
      const delay= (Math.random()*12).toFixed(1);
      el.textContent = "☁";
      el.style.cssText = `
        position:absolute; top:${top}%; left:${left}%;
        font-size:${sz}px; opacity:${(.2+Math.random()*.28).toFixed(2)};
        filter:blur(1px); pointer-events:none; z-index:3;
        animation: cloud-drift ${dur}s linear ${delay}s infinite alternate;
      `;
      layer.appendChild(el);
    }
  }

  flashScreen(type){
    const el = this.ui.flashFx;
    el.style.cssText = `position:absolute;inset:0;z-index:22;pointer-events:none;`;
    el.className = type==='danger' ? 'flash-danger' : 'flash-move';
    void el.offsetWidth;
    setTimeout(()=>{ el.className=''; el.style.opacity='0'; }, 700);
  }

  // ── Settlement cluster renderer ──────────────────────────────────────
  spawnSettlement(s, spawn){
    const builds     = s.builds;
    const housingCap = s.housingCap;
    const initH      = this.safe(TUNING.INIT_HOUSING, 15);

    // Show settlement dust patch
    const base = this.ui.settlementBase;
    if(builds > 0){
      const w = Math.min(52, 18 + builds*5);
      const h = Math.min(30, 12 + builds*3);
      base.style.cssText = `
        display:block; left:${14}%; bottom:${10}%;
        width:${w}%; height:${h}%;
        background: radial-gradient(ellipse, rgba(100,75,40,.18) 0%, transparent 70%);
        border-radius:50%; z-index:5; pointer-events:none; transition:all 1s ease;
      `;
    } else {
      base.style.display = 'none';
    }

    // No builds yet — nomadic camp
    if(builds === 0){
      const campCount = 2 + Math.floor((housingCap - initH) / 5) + 2;
      for(let i=0; i<Math.min(campCount, 5); i++){
        const sz = 18 + Math.floor(Math.random()*8);
        spawn(
          `<i class="fas fa-campground" style="color:#a8a29e;font-size:${sz}px;filter:drop-shadow(1px 2px 4px rgba(0,0,0,.7));"></i>`,
          16 + i*7 + (Math.random()-0.5)*5, 14 + Math.random()*8, 20
        );
      }
      return;
    }

    // Settled — place structures in an organic cluster
    // Number of visible structures grows with builds + housing
    const structCount = Math.min(40, builds*5 + Math.ceil((housingCap - initH)/3) + 3);

    // Settlement origin (left-center of landscape, sitting on ground)
    const ox = 22;  // % from left
    const oy = 15;  // % from bottom

    // Density tier determines layout algorithm
    const isMega = builds >= 7;
    const isCity = builds >= 4;
    const isTown = builds >= 2;

    for(let i=0; i<structCount; i++){
      let x, y, z;
      const jx = (Math.random()-.5)*2.5;
      const jy = (Math.random()-.5)*1.8;

      if(isMega){
        // Very dense: 7-wide grid, buildings packed tightly
        const cols = 7;
        const col  = i % cols;
        const row  = Math.floor(i/cols);
        x = ox + (col-3)*5.2 + jx;
        y = oy + row*5.8 + jy;
        z = 18 + row*2;
      } else if(isCity){
        // Medium density: 5-wide grid
        const cols = 5;
        const col  = i % cols;
        const row  = Math.floor(i/cols);
        x = ox + (col-2)*6.5 + jx;
        y = oy + row*6.5 + jy;
        z = 18 + row*2;
      } else if(isTown){
        // Looser 4-wide grid
        const cols = 4;
        const col  = i % cols;
        const row  = Math.floor(i/cols);
        x = ox + (col-1.5)*8 + jx*1.5;
        y = oy + row*7 + jy*1.5;
        z = 18 + row;
      } else {
        // Early village — radial scatter around center
        const angle  = (i/(structCount)) * Math.PI * 1.8 + Math.random()*.4;
        const radius = 5 + (i%3)*5 + Math.random()*3;
        x = ox + Math.cos(angle)*radius + jx;
        y = oy + Math.sin(angle)*radius*0.55 + jy;
        z = 18;
      }

      // Icon and size by stage
      let icon, color, sz;
      if(isMega && Math.random()<.22){
        icon='fa-building'; color='#44403c'; sz=14+Math.floor(Math.random()*8);
      } else if((isCity && Math.random()<.55) || (isTown && Math.random()<.3)){
        icon='fa-house-chimney'; color='#6b6560'; sz=16+Math.floor(Math.random()*10);
      } else if(builds>=1 && Math.random()<.65){
        icon='fa-house'; color='#78716c'; sz=15+Math.floor(Math.random()*9);
      } else {
        icon='fa-campground'; color='#9d9087'; sz=16+Math.floor(Math.random()*8);
      }

      // Slightly larger central anchor structure
      if(i===0 && builds>=2){ sz = Math.floor(sz*1.5); }

      spawn(
        `<i class="fas ${icon}" style="color:${color};font-size:${sz}px;filter:drop-shadow(1px 2px 4px rgba(0,0,0,.7));"></i>`,
        Math.max(2, Math.min(93, x)), Math.max(8, y), z
      );
    }
  }

  render(){
    const s   = this.state;
    const cap = this.getTotalStorage();
    const mv  = this.moveCost();

    // ── Text stats ──
    this.ui.pop.innerText     = s.pop;
    this.ui.housing.innerText = s.housingCap;
    this.ui.food.innerText    = Math.floor(s.food);
    this.ui.storage.innerText = cap;
    this.ui.year.innerText    = s.turn;
    this.ui.uiLand.innerText   = Math.round(s.land);
    this.ui.uiDeer.innerText   = Math.round(s.deer);
    this.ui.uiSqualor.innerText= Math.round(s.squalor);
    this.ui.uiMammoths.innerText = Game.worldMammoths;

    // ── Ecology index ──
    const landN = this.clamp(s.land,0,100)/100;
    const deerN = this.clamp(s.deer,0,100)/100;
    const eco   = this.clamp(.55*landN + .45*deerN, 0, 1);

    // ── Sky (ecology-driven) ──
    const ls = this.ui.landscape;
    const lsH = ls.style.height; // preserve inline height
    ls.className = 'landscape-container w-full ' + (eco<=.28 ? 'sky-bleak' : eco<=.6 ? 'sky-hazy' : 'sky-pristine');
    ls.style.height = lsH;

    // ── Ground ──
    this.ui.lsGround.className =
      'landscape-ground ' + (eco<=.22 ? 'ground-dead' : eco<=.55 ? 'ground-sparse' : 'ground-lush');

    // ── Progress bars ──
    const popPct     = this.clamp(s.pop/Math.max(1,s.housingCap),0,1)*100;
    const foodPct    = this.clamp(s.food/Math.max(1,cap),0,1)*100;
    const landPct    = this.clamp(s.land,0,100);
    const deerPct    = this.clamp(s.deer,0,100);
    const squalorPct = this.clamp(s.squalor,0,100);

    this.ui.barPop.style.width    = popPct + '%';
    this.ui.barFood.style.width   = foodPct + '%';
    this.ui.barLand.style.width   = landPct + '%';
    this.ui.barDeer.style.width   = deerPct + '%';
    this.ui.barSqualor.style.width= squalorPct + '%';

    this.ui.barPop.style.background   = popPct>90?'#ef4444':popPct>70?'#f59e0b':'#3b82f6';
    this.ui.barFood.style.background  = foodPct<20?'#ef4444':foodPct>90?'#f59e0b':'#d97706';
    this.ui.barLand.style.background  = landPct<25?'#78716c':landPct<50?'#ca8a04':'#22c55e';
    this.ui.barDeer.style.background  = deerPct<25?'#78716c':'#10b981';
    this.ui.barSqualor.style.background = squalorPct>70?'#ef4444':squalorPct>40?'#f59e0b':'#78716c';

    this.ui.uiLand.style.color    = landPct<25?'#f87171':landPct<50?'#fbbf24':'#86efac';
    this.ui.uiDeer.style.color    = deerPct<25?'#f87171':deerPct<50?'#fbbf24':'#6ee7b7';
    this.ui.uiSqualor.style.color = squalorPct>55?'#f87171':squalorPct>30?'#fbbf24':'#a8a29e';

    // ── Move cost color ──
    this.ui.moveCostText.innerText   = `Cost: ${mv}`;
    this.ui.moveCostText.style.color = s.food<mv ? '#f87171' : '#60a5fa';

    // ── Storage warn ──
    this.ui.storageWarn.classList.toggle('hidden', s.food < cap);

    // ── Squalor overlays ──
    const sq = this.clamp(s.squalor,0,100)/100;
    this.ui.squalorFx.style.opacity = sq<.15 ? 0 : this.clamp((sq-.15)*1.1, 0, .92);
    this.ui.sickTint.style.opacity  = sq<.35 ? 0 : this.clamp((sq-.35)*1.2, 0, .55);

    // ── Spawn helper ──
    this.ui.entities.innerHTML = "";
    const spawn = (html, x, y, z, cls="") => {
      const el = document.createElement('div');
      el.className = `entity animate-grow ${cls}`;
      el.innerHTML = html;
      el.style.left   = x + "%";
      el.style.bottom = y + "%";
      el.style.zIndex = z;
      this.ui.entities.appendChild(el);
    };

    // ── Trees (background) ──
    const trees = Math.max(0, Math.ceil(s.land/10));
    for(let i=0; i<trees; i++){
      const sz  = 28 + Math.floor(Math.random()*18);
      const op  = (.5 + Math.random()*.35).toFixed(2);
      spawn(`<i class="fas fa-tree" style="color:#14532d;font-size:${sz}px;opacity:${op};filter:drop-shadow(1px 2px 2px rgba(0,0,0,.4));"></i>`,
            Math.random()*90, 28+Math.random()*30, 8, 'animate-sway');
    }

    // ── Stumps ──
    if(s.land < 45){
      const stumps = Math.min(12, 2+Math.floor((45-s.land)/3));
      for(let i=0; i<stumps; i++)
        spawn(`<span style="font-size:16px;opacity:.75;">🪵</span>`, 10+Math.random()*80, 22+Math.random()*14, 9);
    }

    // ── Land bones ──
    if(s.land < 20){
      const bones = Math.min(8, 1+Math.floor((20-s.land)/3));
      for(let i=0; i<bones; i++)
        spawn(`<span style="font-size:18px;opacity:.65;">🦴</span>`, 15+Math.random()*70, 22+Math.random()*14, 10);
    }

    // ── Mammoths (mid-ground) ──
    if(Game.worldMammoths>0 && s.deer>=25 && s.land>=20){
      const mamCount = Math.min(2, 1+Math.floor(Game.worldMammoths/6));
      for(let i=0; i<mamCount; i++){
        const delay = (Math.random()*2.2).toFixed(2);
        const sz    = 26 + Math.floor(Math.random()*12);
        spawn(`<span style="font-size:${sz}px;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.5));animation-delay:${delay}s;">🦣</span>`,
              55+Math.random()*36, 24+Math.random()*16, 28, "animate-lumber");
      }
    }

    // ── Deer ──
    if(s.deer>=25 && s.land>=20){
      const deerCount = Math.min(7, 1+Math.floor(s.deer/15));
      for(let i=0; i<deerCount; i++){
        const delay = (Math.random()*1.8).toFixed(2);
        const sz    = 16 + Math.floor(Math.random()*10);
        spawn(`<span style="font-size:${sz}px;filter:drop-shadow(1px 1px 0 rgba(255,255,255,.3));animation-delay:${delay}s;">🦌</span>`,
              50+Math.random()*42, 23+Math.random()*20, 30, "animate-hop");
      }
    } else if(s.deer < 25){
      const bonesFew = Math.min(6, 1+Math.floor((25-s.deer)/5));
      for(let i=0; i<bonesFew; i++)
        spawn(`<span style="font-size:18px;opacity:.55;">🦴</span>`, 55+Math.random()*38, 24+Math.random()*14, 30);
    }

    // ── Settlement cluster (left side) ──
    this.spawnSettlement(s, spawn);

    // ── Farms (arc above settlement) ──
    for(let i=0; i<Math.min(18,s.farms); i++){
      spawn(`<i class="fas fa-wheat-awn" style="color:#fcd34d;font-size:24px;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.5));"></i>`,
            5+(i*4.8), 38+Math.sin(i*.5)*4, 22);
    }

    // ── People (foreground) ──
    const showSick = s.squalor > 35;
    for(let i=0; i<Math.min(28,s.pop); i++){
      const pColor = showSick && Math.random()<.3 ? '#4ade80' : '#1c1917';
      spawn(`<i class="fas fa-person animate-bob" style="color:${pColor};font-size:20px;filter:drop-shadow(1px 1px 0 rgba(255,255,255,.15));"></i>`,
            8+Math.random()*84, 6+Math.random()*16, 48);
    }

    // ── Squalor indicators ──
    if(s.squalor > 35){
      const sickN = Math.min(10, 1+Math.floor((s.squalor-30)/7));
      for(let i=0; i<sickN; i++)
        spawn(`<span style="font-size:16px;opacity:.9;">🤢</span>`, 12+Math.random()*76, 10+Math.random()*12, 55, "animate-bob");
      const flies = Math.min(10, 1+Math.floor((s.squalor-30)/8));
      for(let i=0; i<flies; i++)
        spawn(`<span style="font-size:14px;opacity:.7;">🪰</span>`, 18+Math.random()*64, 10+Math.random()*10, 56, "animate-bob");
    }
    if(s.squalor > 70){
      const rats = Math.min(7, 1+Math.floor((s.squalor-70)/6));
      for(let i=0; i<rats; i++)
        spawn(`<span style="font-size:16px;opacity:.8;">🐀</span>`, 15+Math.random()*70, 8+Math.random()*8, 57, "animate-bob");
      const trash = Math.min(8, 1+Math.floor((s.squalor-70)/8));
      for(let i=0; i<trash; i++)
        spawn(`<span style="font-size:16px;opacity:.75;">🗑️</span>`, 18+Math.random()*64, 8+Math.random()*8, 58);
    }
  }

  shake(){
    this.ui.container.classList.add('shake-screen');
    setTimeout(()=>this.ui.container.classList.remove('shake-screen'), 500);
  }

  spawnFloater(text, color){
    const p = {
      red:   { bg:'rgba(127,0,0,.88)',    bd:'rgba(239,68,68,.6)',   tx:'#fca5a5' },
      amber: { bg:'rgba(100,55,0,.88)',   bd:'rgba(251,191,36,.5)',  tx:'#fde68a' },
      blue:  { bg:'rgba(0,30,100,.88)',   bd:'rgba(96,165,250,.5)',  tx:'#bfdbfe' },
      stone: { bg:'rgba(40,35,28,.88)',   bd:'rgba(168,162,158,.4)', tx:'#e7e5e4' },
    }[color] || { bg:'rgba(40,35,28,.88)', bd:'rgba(168,162,158,.4)', tx:'#e7e5e4' };
    const el = document.createElement('div');
    el.innerText = text;
    el.className = 'floater';
    el.style.cssText = `background:${p.bg};border:1px solid ${p.bd};color:${p.tx};left:${30+Math.random()*40}%;top:${25+Math.random()*22}%;`;
    this.ui.landscape.appendChild(el);
    setTimeout(()=>el.remove(), 2200);
  }

  log(text, type){
    const cfg = {
      birth: { icon:'👶', cls:'text-blue-300' },
      death: { icon:'💀', cls:'text-red-400 font-semibold' },
      hunt:  { icon:'🏹', cls:'text-green-400' },
      farm:  { icon:'🌾', cls:'text-amber-400' },
      build: { icon:'🛖', cls:'text-stone-400' },
      move:  { icon:'🚶', cls:'text-blue-400' },
      warn:  { icon:'⚠️', cls:'text-amber-500 font-semibold' },
      info:  { icon:'📜', cls:'text-stone-500' },
    };
    const { icon, cls } = cfg[type] || cfg.info;
    const div = document.createElement('div');
    div.className = `flex items-start gap-1.5 py-1.5 ${cls}`;
    div.style.borderBottom = '1px solid rgba(255,255,255,.04)';
    div.innerHTML = `
      <span class="shrink-0 mt-px" style="font-size:10px;">${icon}</span>
      <span class="text-[11px] leading-snug flex-1">
        <span style="color:#57534e;font-size:9px;margin-right:3px;font-family:monospace;">[Y${this.state.turn}]</span>${text}
      </span>`;
    this.ui.log.insertBefore(div, this.ui.log.children[1] || null);
  }
}

window.onload = ()=>{ window.game = new Game(); };
</script>
